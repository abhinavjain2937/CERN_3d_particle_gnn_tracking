[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackml-edge-classifier"
version = "0.1.0"
description = "Hit-graph edge classification on simulated TrackML particle-tracking data (PyTorch Geometric)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhinav Jain" }]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "torch>=2.0",
    "torch-geometric>=2.4",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
trackml-edge = "trackml_edge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
