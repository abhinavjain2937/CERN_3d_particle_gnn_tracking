# Default experiment configuration. Any value can be overridden on the command line.
seed: 42

# --- data -------------------------------------------------------------
data_root: data/train_sample   # folder (searched recursively) or .zip containing event*-hits.csv / event*-truth.csv
out_dir: runs/default
r_max: 200.0                   # keep hits with transverse radius < r_max (mm): inner barrel
k_neighbors: 5                 # candidate edges per hit
n_train: 5                     # events are sorted by file name, then split train / val / test
n_val: 2
n_test: 5

# --- models -----------------------------------------------------------
models: [edge_mlp, gcn]        # edge_mlp: edge-feature MLP (no message passing); gcn: 2x GCNConv + same head
hidden: 64
dropout: 0.2

# --- optimisation -----------------------------------------------------
epochs: 60
lr: 0.003
weight_decay: 0.0001
pos_weight_cap: 12.0           # cap on the positive-class weight in the BCE loss
eval_every: 5                  # validation ROC-AUC every N epochs; best epoch's weights are kept

device: auto                   # auto | cpu | cuda
